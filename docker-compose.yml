services:
  backend:
    build: ./backend
    volumes:
      # Bind-mount so downloads are visible in Finder under ./data/library
      - ./data:/data
    environment:
      DATA_DIR: /data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
