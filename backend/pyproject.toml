[project]
name = "anime-downloader"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.38",
  "pydantic>=2.12",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "httpx>=0.28",
  "yt-dlp>=2025.1.0",
]

[dependency-groups]
dev = ["pytest>=8.4", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anime_downloader"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
